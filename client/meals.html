<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ascend.AI — Meals</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="./styles.css" />
  <link rel="stylesheet" href="./meal-details.css" />
</head>
<body>

  <div class="bubble"></div>
  <div class="bubble"></div>
  <div class="bubble"></div>

  <div id="page" style="display:none">
    <div class="topbar">
      <div class="topbar-logo">
        <span class="topbar-platy">
          <svg width="26" height="26" viewBox="0 0 140 140" fill="none">
            <ellipse cx="70" cy="86" rx="42" ry="31" fill="#ff7c4a"/>
            <ellipse cx="70" cy="91" rx="26" ry="19" fill="#ffb89e"/>
            <ellipse cx="70" cy="54" rx="28" ry="26" fill="#ff7c4a"/>
            <ellipse cx="95" cy="60" rx="19" ry="9" fill="#ff4d8f"/>
            <circle cx="80" cy="49" r="7" fill="white"/>
            <circle cx="80" cy="49" r="4" fill="#1a0a0a"/>
            <circle cx="82" cy="47" r="1.5" fill="white"/>
            <ellipse cx="54" cy="116" rx="15" ry="6" fill="#ff4d8f" transform="rotate(-8 54 116)"/>
            <ellipse cx="86" cy="116" rx="15" ry="6" fill="#ff4d8f" transform="rotate(8 86 116)"/>
          </svg>
        </span>
        Ascend.AI
      </div>
      <nav class="topbar-nav">
        <a href="/" class="nav-link">Dashboard</a>
        <a href="/meals.html" class="nav-link active">Meals</a>
        <a href="/feed.html" class="nav-link">Feed</a>
        <a href="/trainer.html" class="nav-link">Trainer</a>
      </nav>
      <div class="user-info">
        <div class="avatar-placeholder" id="avatar-initial">?</div>
        <span class="user-name" id="user-name-display"></span>
        <button class="logout-btn" onclick="logout()">Sign out</button>
      </div>
    </div>

    <div class="main">
      <div class="page-header">
        <div>
          <h1 class="page-title">🍽️ My Meals</h1>
          <p class="page-subtitle">Your full nutrition history</p>
        </div>
        <a href="/" class="outline-btn" style="margin-top:0; text-decoration:none;">+ Log New Meal</a>
      </div>

      <!-- Filters -->
      <div class="card" style="padding: 1.25rem 2rem;">
        <div class="filters-row">
          <div class="field" style="flex:1; margin-top:0;">
            <label>Search</label>
            <input type="text" id="search-input" placeholder="Search meals..." oninput="filterMeals()" />
          </div>
          <div class="field" style="margin-top:0;">
            <label>Sort by</label>
            <select id="sort-select" onchange="filterMeals()">
              <option value="newest">Newest first</option>
              <option value="oldest">Oldest first</option>
              <option value="calories-high">Most calories</option>
              <option value="calories-low">Fewest calories</option>
            </select>
          </div>
        </div>
      </div>

      <!-- Summary bar -->
      <div class="summary-bar" id="summary-bar" style="display:none">
        <span id="summary-count"></span>
        <span id="summary-cals"></span>
        <span id="summary-protein"></span>
      </div>

      <!-- Meals grid -->
      <div class="card">
        <div class="meals-full-grid" id="meals-grid">
          <div class="meals-empty">Loading meals...</div>
        </div>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>
  <script src="./meal-details.js"></script>
  <script src="./meals.js"></script>
</body>
</html>
